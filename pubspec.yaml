name: oxlift
description: "Oxlift - get strong as an ox."
publish_to: 'none'

# version is build-name+build-number (Android versionName+versionCode,
# iOS CFBundleShortVersionString+CFBundleVersion).
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  http: ^1.6.0
  cached_network_image: ^3.4.1
  fl_chart: ^1.2.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  # drift is held below 2.32 / drift_flutter below 0.3 because newer releases
  # need Dart >= 3.11. Lift these pins after `flutter upgrade`.
  drift: ">=2.28.0 <2.32.0"
  drift_flutter: ^0.2.4
  flutter_cache_manager: ^3.4.5
  wakelock_plus: ^1.6.1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ">=2.28.0 <2.32.0"
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4

# Regenerate icons: `flutter test tool/render_icon_test.dart`, then
# `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/icon.png
  adaptive_icon_background: "#0B0D10"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/brand/

  # Bundled (not fetched at runtime) so text renders offline in the gym.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
